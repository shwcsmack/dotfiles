# Dracula-themed starship prompt
# Two-line prompt: info on top, character on the bottom (room to think)
format = """
[](color_purple)\
$os\
$username\
[](bg:color_pink fg:color_purple)\
$directory\
[](fg:color_pink bg:color_cyan)\
$git_branch\
$git_status\
[](fg:color_cyan bg:color_bg3)\
$nodejs\
$rust\
$python\
$golang\
[](fg:color_bg3 bg:color_bg1)\
$docker_context\
$cmd_duration\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'dracula'

[palettes.dracula]
color_fg0 = '#f8f8f2'
color_bg1 = '#282a36'
color_bg3 = '#44475a'
color_purple = '#bd93f9'
color_pink = '#ff79c6'
color_cyan = '#8be9fd'
color_green = '#50fa7b'
color_yellow = '#f1fa8c'
color_orange = '#ffb86c'
color_red = '#ff5555'

[os]
disabled = false
style = "bg:color_purple fg:color_fg0"
[os.symbols]
Macos = ""

[username]
show_always = true
style_user = "bg:color_purple fg:color_fg0"
style_root = "bg:color_red fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_pink"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " 󰈙 "
"Downloads" = "  "
"code" = "  "
"projects" = "  "

[git_branch]
symbol = ""
style = "bg:color_cyan"
format = '[[ $symbol $branch ](fg:color_bg1 bg:color_cyan)]($style)'

[git_status]
style = "bg:color_cyan"
format = '[[($all_status$ahead_behind )](fg:color_bg1 bg:color_cyan)]($style)'

[nodejs]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg3)]($style)'

[rust]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg3)]($style)'

[python]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg3)]($style)'

[golang]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol ($version) ](fg:color_fg0 bg:color_bg3)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg1)]($style)'

[cmd_duration]
min_time = 2_000
style = "fg:color_yellow bg:color_bg1"
format = '[ took $duration ]($style)'

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol  = '[](bold fg:color_red)'
